<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="coi-serviceworker.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CZICheck</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #0f1117;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
        }

        /* ---- Full-page drag overlay ---- */
        .drag-overlay {
            display: none;
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(13, 17, 23, 0.92);
            align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
        }
        .drag-overlay.active { display: flex; }
        .drag-overlay .drop-icon { font-size: 64px; opacity: 0.8; }
        .drag-overlay .drop-text {
            font-size: 22px; font-weight: 600; color: #58a6ff;
            text-shadow: 0 0 20px rgba(88,166,255,0.3);
        }
        .drag-overlay .drop-ring {
            width: 200px; height: 200px;
            border: 3px dashed #58a6ff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            animation: pulse-ring 2s ease-in-out infinite;
        }
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); border-color: #58a6ff; }
            50% { transform: scale(1.06); border-color: #79c0ff; }
        }

        /* ---- Header ---- */
        header {
            background: #161b22;
            padding: 10px 20px;
            border-bottom: 1px solid #21262d;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        header h1 { font-size: 18px; font-weight: 600; color: #58a6ff; letter-spacing: -0.3px; }
        header .version { font-size: 11px; color: #484f58; font-family: monospace; }
        header .file-pill {
            margin-left: auto;
            display: none;
            align-items: center; gap: 8px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 13px;
        }
        header .file-pill.has-file { display: flex; }
        header .file-pill .fname { color: #58a6ff; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        header .file-pill .fsize { color: #484f58; }
        header .file-pill .clear-btn {
            background: none; border: none; color: #484f58; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 0 0 4px;
        }
        header .file-pill .clear-btn:hover { color: #f85149; }

        /* ---- Layout ---- */
        .main { display: flex; flex: 1; overflow: hidden; }

        /* ---- Sidebar ---- */
        .sidebar {
            width: 280px; min-width: 280px;
            background: #161b22;
            border-right: 1px solid #21262d;
            padding: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar-section {
            padding: 14px 16px;
            border-bottom: 1px solid #21262d;
        }
        .sidebar-section:last-child { border-bottom: none; }
        .sidebar-title {
            font-size: 11px; font-weight: 600; color: #484f58;
            text-transform: uppercase; letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        /* File zone (compact in sidebar) */
        .file-zone {
            border: 1px dashed #30363d;
            border-radius: 6px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .file-zone:hover { border-color: #58a6ff; background: rgba(88,166,255,0.04); }
        .file-zone .fz-icon { font-size: 20px; margin-bottom: 4px; }
        .file-zone .fz-text { font-size: 12px; color: #484f58; }

        /* Checkers */
        .checkers-list { display: flex; flex-direction: column; gap: 2px; }
        .checker-item {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 6px;
            border-radius: 4px;
            font-size: 13px;
            transition: background 0.15s;
        }
        .checker-item:hover { background: rgba(255,255,255,0.03); }
        .checker-item input[type="checkbox"] {
            accent-color: #58a6ff;
            width: 14px; height: 14px;
            flex-shrink: 0;
        }
        .checker-item .name { color: #c9d1d9; cursor: pointer; }
        .checker-item .opt-in {
            font-size: 10px; color: #484f58;
            background: #21262d; padding: 1px 5px; border-radius: 3px;
            margin-left: auto; flex-shrink: 0;
        }

        /* Options */
        .option-group { display: flex; flex-direction: column; gap: 10px; }
        .option-row {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 13px;
        }
        .option-row label { color: #8b949e; }
        .option-row select, .option-row input[type="number"] {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .option-row select:focus, .option-row input[type="number"]:focus {
            outline: none; border-color: #58a6ff;
        }

        /* Run button + spinner */
        .sidebar-actions {
            padding: 14px 16px;
            margin-top: auto;
            border-top: 1px solid #21262d;
        }
        .run-btn {
            width: 100%;
            background: #238636;
            color: #fff;
            border: 1px solid #2ea043;
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .run-btn:hover { background: #2ea043; }
        .run-btn:disabled { background: #21262d; border-color: #30363d; color: #484f58; cursor: not-allowed; }
        .spinner-container {
            display: none;
            align-items: center; justify-content: center;
            gap: 8px;
            color: #8b949e;
            font-size: 13px;
            margin-top: 10px;
        }
        .spinner-container.active { display: flex; }
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- Results area ---- */
        .results-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .results-area .placeholder {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 12px;
            color: #30363d;
        }
        .placeholder .ph-icon { font-size: 48px; }
        .placeholder .ph-text { font-size: 15px; }
        .placeholder .ph-hint { font-size: 12px; color: #21262d; }

        /* Aggregated banner */
        .agg-banner {
            display: flex; align-items: center; gap: 16px;
            padding: 16px 20px;
            border-radius: 8px;
            font-size: 15px;
        }
        .agg-banner .agg-icon { font-size: 28px; }
        .agg-banner .agg-body { display: flex; flex-direction: column; gap: 2px; }
        .agg-banner .agg-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; opacity: 0.7; }
        .agg-banner .agg-value { font-size: 20px; font-weight: 700; }
        .agg-banner .agg-detail { font-size: 12px; opacity: 0.7; }
        .agg-ok   { background: #0d2818; border: 1px solid #1b4332; }
        .agg-ok .agg-value { color: #3fb950; }
        .agg-warn { background: #2a1f0d; border: 1px solid #4a3728; }
        .agg-warn .agg-value { color: #d29922; }
        .agg-fail { background: #2a0d0d; border: 1px solid #4a2020; }
        .agg-fail .agg-value { color: #f85149; }

        /* Test cards */
        .test-card {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            border-left: 3px solid #21262d;
        }
        .test-card.card-ok   { border-left-color: #238636; }
        .test-card.card-warn { border-left-color: #d29922; }
        .test-card.card-fail { border-left-color: #f85149; }
        .test-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 16px;
            background: #0d1117;
            border-bottom: 1px solid #21262d;
        }
        .test-header.clickable { cursor: pointer; user-select: none; }
        .test-header.clickable:hover { background: #131921; }
        .test-header .expand-arrow {
            font-size: 10px; color: #484f58; margin-right: 8px;
            display: inline-block; transition: transform 0.2s;
        }
        .test-card.open .test-header .expand-arrow { transform: rotate(90deg); }
        .test-name { font-size: 14px; font-weight: 500; color: #c9d1d9; }
        .badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .badge-ok   { background: #0d2818; color: #3fb950; }
        .badge-warn { background: #2a1f0d; color: #d29922; }
        .badge-fail { background: #2a0d0d; color: #f85149; }

        .test-body { padding: 10px 16px; }
        .test-body.collapsed {
            display: none;
        }
        .test-body.empty { padding: 8px 16px; }
        .test-ok-msg { font-size: 13px; color: #3fb950; opacity: 0.7; }
        .test-header .findings-count {
            font-size: 11px; color: #8b949e; margin-left: auto; margin-right: 10px;
        }

        .finding-row {
            padding: 8px 0 8px 12px;
            border-left: 3px solid #30363d;
            margin-top: 6px;
            font-size: 13px;
            line-height: 1.5;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .finding-row:hover { opacity: 0.65; }
        .finding-row .dismiss-hint {
            float: right; font-size: 11px; color: #30363d; margin-left: 8px;
            transition: color 0.15s;
        }
        .finding-row:hover .dismiss-hint { color: #8b949e; }
        .finding-row .severity {
            font-weight: 600; margin-right: 6px;
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px;
        }
        .finding-row .finding-text { color: #c9d1d9; }
        .finding-row .finding-details {
            color: #484f58; margin-top: 3px; font-size: 12px; line-height: 1.5;
        }
        .severity-FATAL   { color: #f85149; }
        .severity-WARNING { color: #d29922; }
        .severity-INFO    { color: #58a6ff; }
        .finding-row.sev-FATAL   { border-left-color: #f85149; }
        .finding-row.sev-WARNING { border-left-color: #d29922; }
        .finding-row.sev-INFO    { border-left-color: #58a6ff; }

        /* Raw JSON panel */
        .raw-section {
            display: flex; flex-direction: column; gap: 0;
        }
        .raw-section.expanded { flex: 1; min-height: 0; }
        .toggle-raw {
            background: #161b22;
            border: 1px solid #21262d;
            color: #8b949e;
            padding: 8px 14px;
            border-radius: 6px 6px 0 0;
            font-size: 12px;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: color 0.15s;
            flex-shrink: 0;
        }
        .toggle-raw:hover { color: #c9d1d9; }
        .toggle-raw .arrow { transition: transform 0.2s; display: inline-block; }
        .toggle-raw.open .arrow { transform: rotate(90deg); }
        .toggle-raw:not(.open) + .raw-json { display: none; }
        .raw-json {
            background: #0d1117;
            border: 1px solid #21262d;
            border-top: none;
            border-radius: 0 0 6px 6px;
            padding: 16px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            color: #8b949e;
            tab-size: 2;
        }

        #status {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 12px;
            font-size: 14px; color: #484f58;
        }
        #status .loading-spinner {
            width: 28px; height: 28px;
            border: 3px solid #21262d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #30363d; }
    </style>
</head>
<body>

    <!-- Full-page drag overlay -->
    <div class="drag-overlay" id="dragOverlay">
        <div class="drop-ring">
            <div class="drop-icon">&#128194;</div>
        </div>
        <div class="drop-text">Drop CZI file to open</div>
    </div>

    <div id="status">
        <div class="loading-spinner"></div>
        <span>Loading CZICheck...</span>
    </div>

    <header style="display:none" id="app">
        <h1>CZICheck</h1>
        <span class="version" id="versionInfo"></span>
        <div class="file-pill" id="filePill">
            <span class="fname" id="fileName"></span>
            <span class="fsize" id="fileSize"></span>
            <button class="clear-btn" id="clearFile" title="Clear file">&times;</button>
        </div>
    </header>

    <div class="main" style="display:none" id="mainContent">
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">File</div>
                <div class="file-zone" id="fileZone">
                    <div class="fz-icon">&#128194;</div>
                    <div class="fz-text">Click to browse or drag anywhere</div>
                </div>
                <input type="file" id="fileInput" accept=".czi" style="display:none">
            </div>

            <div class="sidebar-section" style="flex:1; overflow-y:auto;">
                <div class="sidebar-title">Checkers</div>
                <div class="checkers-list" id="checkersList"></div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Options</div>
                <div class="option-group">
                    <div class="option-row">
                        <label>Max findings</label>
                        <input type="number" id="optMaxFindings" value="10" min="-1" style="width:60px">
                    </div>
                    <div class="option-row">
                        <label>Lax parsing</label>
                        <select id="optLaxParsing"><option value="false">No</option><option value="true">Yes</option></select>
                    </div>
                    <div class="option-row">
                        <label>Ignore SizeM</label>
                        <select id="optIgnoreSizeM"><option value="false">No</option><option value="true">Yes</option></select>
                    </div>
                    <div class="option-row">
                        <label>Fail-fast</label>
                        <select id="optFailFast">
                            <option value="none">None</option>
                            <option value="checker">Per checker</option>
                            <option value="all">All</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="sidebar-actions">
                <button class="run-btn" id="runBtn" disabled>Run Checks</button>
                <div class="spinner-container" id="spinner">
                    <div class="spinner"></div>
                    <span>Running checks...</span>
                </div>
            </div>
        </div>

        <div class="results-area" id="resultsArea">
            <div class="placeholder">
                <div class="ph-icon">&#128269;</div>
                <div class="ph-text">No results yet</div>
                <div class="ph-hint">Drop a .czi file anywhere on this page, then click Run Checks</div>
            </div>
        </div>
    </div>

    <script>
    var Module = {
        _fileHandles: [],
        onRuntimeInitialized: function() {
            document.getElementById('status').style.display = 'none';
            document.getElementById('app').style.display = '';
            document.getElementById('mainContent').style.display = '';
            initApp();
        }
    };

    var coiReloaded = window.sessionStorage.getItem('coiReloadedBySelf');
    if (typeof SharedArrayBuffer === 'undefined' && coiReloaded) {
        var statusEl = document.getElementById('status');
        statusEl.innerHTML = '<span style="color:#f85149">SharedArrayBuffer not available.<br>'
            + 'Ensure the server sends COOP/COEP headers.</span>';
    }

    var currentFile = null;
    var dragCounter = 0; // track nested dragenter/dragleave

    function initApp() {
        populateCheckers();
        setupFileHandling();
        setupRunButton();
    }

    function populateCheckers() {
        var json = Module.getCheckers();
        var checkers = JSON.parse(json);
        var container = document.getElementById('checkersList');
        container.innerHTML = '';

        checkers.forEach(function(c) {
            var item = document.createElement('div');
            item.className = 'checker-item';

            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = !c.isOptIn;
            cb.dataset.shortName = c.shortName;
            cb.id = 'chk_' + c.shortName;

            var lbl = document.createElement('label');
            lbl.htmlFor = cb.id;
            lbl.className = 'name';
            lbl.textContent = c.displayName;

            item.appendChild(cb);
            item.appendChild(lbl);

            if (c.isOptIn) {
                var tag = document.createElement('span');
                tag.className = 'opt-in';
                tag.textContent = 'opt-in';
                item.appendChild(tag);
            }

            container.appendChild(item);
        });
    }

    function setupFileHandling() {
        var fileZone = document.getElementById('fileZone');
        var fileInput = document.getElementById('fileInput');
        var overlay = document.getElementById('dragOverlay');

        fileZone.addEventListener('click', function() { fileInput.click(); });

        // Full-page drag and drop
        document.addEventListener('dragenter', function(e) {
            e.preventDefault();
            dragCounter++;
            overlay.classList.add('active');
        });
        document.addEventListener('dragleave', function(e) {
            e.preventDefault();
            dragCounter--;
            if (dragCounter <= 0) {
                dragCounter = 0;
                overlay.classList.remove('active');
            }
        });
        document.addEventListener('dragover', function(e) {
            e.preventDefault();
        });
        document.addEventListener('drop', function(e) {
            e.preventDefault();
            dragCounter = 0;
            overlay.classList.remove('active');
            if (e.dataTransfer.files.length > 0) {
                selectFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectFile(e.target.files[0]);
                e.target.value = '';
            }
        });

        document.getElementById('clearFile').addEventListener('click', function() {
            currentFile = null;
            document.getElementById('filePill').classList.remove('has-file');
            document.getElementById('runBtn').disabled = true;
        });
    }

    function selectFile(file) {
        currentFile = file;
        document.getElementById('fileName').textContent = file.name;
        document.getElementById('fileSize').textContent = formatSize(file.size);
        document.getElementById('filePill').classList.add('has-file');
        document.getElementById('runBtn').disabled = false;
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
        return (bytes / 1073741824).toFixed(2) + ' GB';
    }

    function setupRunButton() {
        document.getElementById('runBtn').addEventListener('click', function() {
            if (!currentFile) return;
            runChecks();
        });
    }

    function getSelectedCheckers() {
        var checks = [];
        var boxes = document.querySelectorAll('#checkersList input[type=checkbox]:checked');
        boxes.forEach(function(cb) { checks.push(cb.dataset.shortName); });
        return checks;
    }

    function buildConfigJson() {
        return JSON.stringify({
            checks: getSelectedCheckers(),
            laxParsing: document.getElementById('optLaxParsing').value === 'true',
            ignoreSizeM: document.getElementById('optIgnoreSizeM').value === 'true',
            maxFindings: parseInt(document.getElementById('optMaxFindings').value, 10),
            failFast: document.getElementById('optFailFast').value
        });
    }

    function runChecks() {
        var file = currentFile;
        var handle = Module._fileHandles.length;
        Module._fileHandles.push(file);

        var configStr = buildConfigJson();

        document.getElementById('runBtn').disabled = true;
        document.getElementById('spinner').classList.add('active');

        var area = document.getElementById('resultsArea');
        area.innerHTML = '';

        var allTests = [];

        // Register the streaming callbacks this after each checker finishes.
        window._onCheckResult = function(jsonStr) {
            try {
                var checkData = JSON.parse(jsonStr);
                if (checkData.tests && checkData.tests.length > 0) {
                    var test = checkData.tests[0];
                    allTests.push(test);
                    var card = createTestCard(test);
                    area.appendChild(card);
                }
            } catch (e) {
                console.warn('[CZICheck] Failed to parse streaming check result:', e);
            }
        };

        setTimeout(async function() {
            try {
                var summaryJson = await Module.runChecks(handle, file.size, configStr);
                window._onCheckResult = null; // unregister

                var summary;
                try { summary = JSON.parse(summaryJson); }
                catch (e) { displayError('Failed to parse final result'); return; }

                if (summary.error) {
                    displayError(summary.message || 'Unknown error');
                    return;
                }

                // Prepend the aggregated banner.
                var agg = summary.aggregatedresult || 'OK';
                var aggClass = agg === 'OK' ? 'agg-ok' : (agg === 'WARN' ? 'agg-warn' : 'agg-fail');
                var aggIcon = agg === 'OK' ? '&#10004;' : (agg === 'WARN' ? '&#9888;' : '&#10008;');
                var aggMsg = agg === 'OK' ? 'All checks passed'
                           : (agg === 'WARN' ? 'Some checks produced warnings' : 'One or more checks failed');

                var testCount = allTests.length;
                var failCount = allTests.filter(function(t){ return t.result === 'FATAL' || t.result === 'FAIL'; }).length;
                var warnCount = allTests.filter(function(t){ return t.result === 'WARN' || t.result === 'WARNING'; }).length;
                var okCount = testCount - failCount - warnCount;

                var detail = testCount + ' check' + (testCount !== 1 ? 's' : '') + ' run';
                if (failCount > 0) detail += ' &middot; ' + failCount + ' failed';
                if (warnCount > 0) detail += ' &middot; ' + warnCount + ' warning' + (warnCount !== 1 ? 's' : '');
                if (okCount > 0) detail += ' &middot; ' + okCount + ' passed';

                var banner = document.createElement('div');
                banner.className = 'agg-banner ' + aggClass;
                banner.innerHTML = '<div class="agg-icon">' + aggIcon + '</div>'
                    + '<div class="agg-body">'
                    + '<div class="agg-label">Aggregated Result</div>'
                    + '<div class="agg-value">' + escapeHtml(agg) + '</div>'
                    + '<div class="agg-detail">' + aggMsg + ' &mdash; ' + detail + '</div>'
                    + '</div>';
                area.insertBefore(banner, area.firstChild);

                // -- Raw JSON section (rebuild full data for display) --
                var fullData = { aggregatedresult: agg, tests: allTests };
                var rawSection = document.createElement('div');
                rawSection.className = 'raw-section';

                var toggleBtn = document.createElement('button');
                toggleBtn.className = 'toggle-raw';
                toggleBtn.innerHTML = '<span class="arrow">&#9654;</span> Raw JSON';
                var rawDiv = document.createElement('div');
                rawDiv.className = 'raw-json';
                rawDiv.textContent = JSON.stringify(fullData, null, 2);

                var testCards = area.querySelectorAll('.test-card');
                toggleBtn.addEventListener('click', function() {
                    var opening = !toggleBtn.classList.contains('open');
                    toggleBtn.classList.toggle('open');
                    rawSection.classList.toggle('expanded', opening);
                    testCards.forEach(function(c) { c.style.display = opening ? 'none' : ''; });
                });
                rawSection.appendChild(toggleBtn);
                rawSection.appendChild(rawDiv);
                area.appendChild(rawSection);

            } catch (e) {
                console.error('[CZICheck] runChecks threw:', e);
                var crashedChecker = window._currentCheckerName || 'unknown';
                window._currentCheckerName = null;

                var isOom = e instanceof WebAssembly.RuntimeError
                    || (e.message && e.message.indexOf('memory') !== -1);
                var errMsg = isOom
                    ? 'Out of WebAssembly memory while running \u201c' + crashedChecker + '\u201d \u2014 '
                      + 'this file is too large for the browser sandbox. '
                      + 'Try running the native CLI build for very large CZI files.'
                    : 'Error in checker \u201c' + crashedChecker + '\u201d: ' + (e.message || e);

                // Show error banner but keep any cards that already streamed in.
                var errBanner = document.createElement('div');
                errBanner.className = 'agg-banner agg-fail';
                errBanner.innerHTML = '<div class="agg-icon">&#9888;</div>'
                    + '<div class="agg-body"><div class="agg-label">Crashed in: ' + escapeHtml(crashedChecker) + '</div>'
                    + '<div class="agg-value">' + escapeHtml(errMsg) + '</div>'
                    + (allTests.length > 0
                        ? '<div class="agg-detail">' + allTests.length + ' check(s) completed before the crash</div>'
                        : '')
                    + '</div>';
                area.insertBefore(errBanner, area.firstChild);
            } finally {
                window._onCheckResult = null;
                document.getElementById('runBtn').disabled = false;
                document.getElementById('spinner').classList.remove('active');
            }
        }, 50);
    }

    function createTestCard(test) {
        var card = document.createElement('div');
        var result = test.result || 'OK';
        var isOk = result === 'OK';
        var isWarn = result === 'WARN' || result === 'WARNING';
        var cardCls = isOk ? 'card-ok' : (isWarn ? 'card-warn' : 'card-fail');
        card.className = 'test-card ' + cardCls;

        var badgeCls = isOk ? 'badge-ok' : (isWarn ? 'badge-warn' : 'badge-fail');
        var hasFindings = test.findings && test.findings.length > 0;

        var hdr = document.createElement('div');
        hdr.className = 'test-header' + (hasFindings ? ' clickable' : '');
        var arrow = hasFindings ? '<span class="expand-arrow">&#9654;</span>' : '';
        var countLabel = hasFindings
            ? '<span class="findings-count">' + test.findings.length + ' finding' + (test.findings.length !== 1 ? 's' : '') + '</span>'
            : '';
        hdr.innerHTML = arrow + '<span class="test-name">' + escapeHtml(test.description || test.name) + '</span>'
            + countLabel
            + '<span class="badge ' + badgeCls + '">' + escapeHtml(result) + '</span>';
        card.appendChild(hdr);

        var body = document.createElement('div');
        body.className = 'test-body';

        if (hasFindings) {
            body.classList.add('collapsed');
            test.findings.forEach(function(f) {
                var row = document.createElement('div');
                row.className = 'finding-row sev-' + (f.severity || 'INFO');
                row.innerHTML = '<span class="dismiss-hint">click to dismiss</span>'
                    + '<span class="severity severity-' + escapeHtml(f.severity || 'INFO') + '">'
                    + escapeHtml(f.severity || 'INFO') + '</span> '
                    + '<span class="finding-text">' + escapeHtml(f.description) + '</span>';
                if (f.details) {
                    row.innerHTML += '<div class="finding-details">' + escapeHtml(f.details) + '</div>';
                }
                row.addEventListener('click', function(e) {
                    e.stopPropagation();
                    row.style.opacity = '0';
                    setTimeout(function() { row.remove(); }, 150);
                });
                body.appendChild(row);
            });
            hdr.addEventListener('click', function() {
                card.classList.toggle('open');
                body.classList.toggle('collapsed');
            });
            card.appendChild(body);
        }

        return card;
    }

    function displayError(msg) {
        var area = document.getElementById('resultsArea');
        area.innerHTML = '<div class="agg-banner agg-fail">'
            + '<div class="agg-icon">&#9888;</div>'
            + '<div class="agg-body"><div class="agg-label">Error</div>'
            + '<div class="agg-value">' + escapeHtml(msg) + '</div></div></div>';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    </script>
